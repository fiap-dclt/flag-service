name: CI/CD Flag Service

# Executa as verificações em pushes e pull requests destinados à main.
# A publicação no ECR e a atualização do GitOps ocorrem apenas em push na main.
# Não ignoramos alterações em .github para validar também o próprio workflow.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Variáveis existentes do pipeline de entrega do Flag Service.
env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "flag-service"
  REGISTRY_URL: "640494160208.dkr.ecr.us-east-1.amazonaws.com"
  GITOPS_REPO: "fiap-dclt/tech-challenge-phase-3-k8s"
  MANIFEST_PATH: "flag-service/deployment.yml"

# Todos os jobs recebem somente a permissão padrão mínima de leitura.
permissions:
  contents: read

jobs:
  # LINTER: verifica a qualidade do código Python com Ruff.
  # Mantém o Python 3.11, utilizado atualmente no estágio de build do Dockerfile.
  lint:
    name: Linter - Ruff
    runs-on: ubuntu-latest
    steps:
      # Obtém o código-fonte para análise.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Instala a versão de Python utilizada pelo projeto.
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Instala uma versão fixa do Ruff para resultados reproduzíveis.
      - name: Install Ruff
        run: python -m pip install ruff==0.17.5

      # Falha o job se o linter identificar violações das regras configuradas.
      - name: Run Ruff Linter
        run: ruff check --output-format=github .

  # SCA: analisa as dependências Python declaradas no requirements.txt.
  # Vulnerabilidades HIGH e CRITICAL com correção disponível bloqueiam o job.
  sca-trivy-fs:
    name: SCA - Trivy FS
    runs-on: ubuntu-latest
    steps:
      # Obtém os arquivos de dependências usados na análise do filesystem.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Analisa bibliotecas no repositório, sem depender da imagem Docker.
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # SAST: examina o código-fonte com o Horusec, incluindo regras para Python.
  # A CLI roda no próprio runner, podendo acessar o Docker sem execução aninhada.
  # A versão beta corrige a detecção de Docker que falhava na CLI v2.8.0.
  sast-horusec:
    name: SAST - Horusec
    runs-on: ubuntu-latest
    steps:
      # Obtém o código e os arquivos de configuração para análise SAST.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Instala uma versão fixa da CLI e exibe a versão do Docker para diagnóstico.
      - name: Install Horusec CLI
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/ZupIT/horusec/releases/download/v2.9.0-beta.3/horusec_linux_amd64 \
            -o horusec
          sudo install -m 755 horusec /usr/local/bin/horusec
          horusec version
          docker version

      # Bloqueia o pipeline quando o Horusec encontra vulnerabilidades.
      - name: Run Horusec SAST Scan
        shell: bash
        run: horusec start -p "$GITHUB_WORKSPACE" -e true

  # SECRET SCANNING: detecta credenciais e tokens expostos no histórico Git.
  # O histórico completo é necessário para identificar vazamentos antigos.
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      # Faz o clone completo do histórico para escanear todos os commits acessíveis.
      - name: Checkout Full Git History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Utiliza a CLI open source via Docker e mascara os valores encontrados.
      # Um .gitleaksignore versionado pode registrar falsos positivos confirmados.
      - name: Scan Git History for Secrets
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose .

  # BUILD + IMAGE SCAN + GITOPS:
  # Aguarda todos os jobs de qualidade e segurança serem aprovados.
  # Constrói e analisa a imagem localmente ANTES de qualquer push ao ECR.
  # Em pull requests, valida a imagem mas não autentica na AWS nem publica.
  build-and-update-gitops:
    name: Build, Image Scan and GitOps Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - sca-trivy-fs
      - sast-horusec
      - secrets-gitleaks
    permissions:
      contents: read
      id-token: write

    steps:
      # Obtém o código para executar o Docker build.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Constrói a imagem com tag igual ao SHA do commit, sem publicá-la.
      # --pull busca atualizações das tags das imagens-base utilizadas.
      - name: Build Docker Image
        shell: bash
        run: |
          docker build --pull \
            -t "${REGISTRY_URL}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            .

      # Examina vulnerabilidades do sistema operacional e bibliotecas da imagem.
      # HIGH/CRITICAL corrigíveis bloqueiam o push e a atualização do GitOps.
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

